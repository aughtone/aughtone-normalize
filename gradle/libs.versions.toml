[versions]
namespace = "io.github.aughtone.normalize"
group = "io.github.aughtone.normalize"
versionName = "0.0.4"
android-minSdk = "17"
android-compileSdk = "37"

agp = "9.4.1"
# Lint's version is always AGP's plus 23.0.0.
lint = "32.4.1"
kotlin = "2.4.20"
kotlinx-serialization = "1.11.0"
kotlinx-datetime = "0.8.0"
vanniktech = "0.37.0"
kotlinBrowser = "2026.9.2"

aughtone-types = "4.0.0"
aughtone-phonenumber = "0.0.4"

[libraries]
lint-api = { module = "com.android.tools.lint:lint-api", version.ref = "lint" }
lint-tests = { module = "com.android.tools.lint:lint-tests", version.ref = "lint" }
junit = { module = "junit:junit", version = "4.13.2" }
kotlin-browser = { module = "org.jetbrains.kotlin-wrappers:kotlin-browser", version.ref = "kotlinBrowser" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }

aughtone-types = { module = "io.github.aughtone:types", version.ref = "aughtone-types" }
aughtone-phonenumber = { module = "io.github.aughtone:phonenumber", version.ref = "aughtone-phonenumber" }

[plugins]
multiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktech" }
