# .github/workflows/test.yml

name: Test

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC"

jobs:
  test:
    name: Apple, JVM and web targets
    runs-on: macOS-latest
    permissions:
      checks: write
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run all tests
        run: ./gradlew check

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: '**/build/test-results/**/*.xml'

  linux:
    # linuxX64 compiles and links on the macOS runner but its test binary cannot
    # be executed there, so linuxX64Test is silently SKIPPED. This job is the
    # only place those tests actually run.
    name: Linux target tests
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run linuxX64 tests
        run: ./gradlew linuxX64Test

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          check_name: JUnit Test Report (linuxX64)
          report_paths: '**/build/test-results/**/*.xml'

  docs-links:
    # The knowledge base publishes to the repo wiki, where every relative link is
    # rewritten to a wiki page or a `blob/HEAD` repo URL. Neither rewrite notices
    # that its target was renamed - the published link just 404s, and GitHub never
    # warns. Deliberately NOT filtered on `paths: docs/**`: several documents link
    # out to files that are never synced (AGENTS.md, WORKFLOW.md, docs/README.md),
    # so the commit that breaks the wiki is often one that touches no doc at all.
    name: Knowledge base links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Check knowledge base links resolve
        run: python3 -I tools/check-docs-links.py
